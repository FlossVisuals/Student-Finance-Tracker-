<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Finance Tracker</title>
  
  <link rel="stylesheet" href="style.css">
</head>

<body>
  
  
  <!-- Header -->
  <header>
    <h1>Student Finance Tracker</h1>
    <p>Manage your money wisely</p>
  </header>
  
    <main>
      
      <section class="summary">
        <h2>Financial Summary</h2>
        
        <p>Total Income: &#x20A6;<span id="income">0</span></p>
        
        <p>Total Expenses: &#x20A6;<span id="expenses">0</span></p>
        
        <p>Balance: &#x20A6;<span id="balance">0</span></p>
      </section>
      
      <section class="form-section">
        <h2>Add Transaction</h2>
        
        <form id="financeForm">
          
          <label for="description">Description</label>
          <input type="text" id="description"
          placeholder="e.g. Allowance or food" required>
          
          <label for="amount">Amount (&#x20A6;) </label>
          <input type="number" id="amount"
          placeholder="Enter amount" min="1" step="any" required>
          
          <label for="type">Transaction Type</label>
          <select id="type">
            <option value="income">Income</option>
            <option value="expenses">Expenses</option>
          </select>
          
          <button type="submit">Add Transaction</button>
        </form>
      </section>
      
      <section class="transaction">
        <h2>Recent Transactions</h2>
          <ul id="transactionList">
            <li>No transaction yet.</li>
          </ul>
      </section>
      
      
    </main>
    
    <footer>
      <p>Student Finace Tracker &copy; 2026</p>
    </footer>
    
    <script src="script.js"></script>
    
</body>

</html>
